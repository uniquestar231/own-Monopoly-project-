<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Monopoly — Friends Edition</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            background: #0c1522;
            color: #edf4ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        header {
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #304057;
        }

        h1 {
            font-size: 23px;
            margin: 0;
        }

        small,
        .muted {
            color: #a9bbd0;
        }

        main {
            display: grid;
            grid-template-columns: minmax(540px, 1fr) 340px;
            gap: 20px;
            padding: 20px;
            max-width: 1500px;
            margin: auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            aspect-ratio: 1;
            background: #c7e2cf;
            border: 3px solid #426a59;
            gap: 2px;
            color: #15291e;
        }

        .space {
            background: #e6f0df;
            position: relative;
            min-width: 0;
            cursor: pointer;
            overflow: hidden;
            font-size: clamp(8px, .8vw, 12px);
            text-align: center;
            padding: 3px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .space:hover {
            outline: 3px solid #e8a521;
            z-index: 2;
        }

        .stripe {
            height: 9px;
            flex-shrink: 0;
        }

        .tokens {
            display: flex;
            justify-content: center;
            gap: 2px;
            flex-wrap: wrap;
        }

        .token {
            background: var(--c);
            color: white;
            border: 1px solid white;
            border-radius: 50%;
            font-size: 10px;
            width: 17px;
            height: 17px;
            display: inline-grid;
            place-items: center;
            box-shadow: 0 1px 3px #0008;
        }

        .center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            text-align: center;
            padding: 20px;
            background: radial-gradient(#edf6e9, #b4d7c0);
        }

        .logo {
            background: #c73638;
            color: white;
            padding: 12px 24px;
            transform: rotate(-7deg);
            font-weight: 900;
            font-size: clamp(22px, 3.5vw, 52px);
            letter-spacing: 2px;
            box-shadow: 3px 4px #0003;
        }

        .dice {
            font-size: 48px;
            letter-spacing: 12px;
        }

        .center h2 {
            margin: 0;
        }

        .panel {
            background: #172538;
            border: 1px solid #304057;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .players {
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }

        .player {
            padding: 10px;
            border-radius: 8px;
            background: #0f1c2c;
            border-left: 5px solid var(--c);
        }

        .active {
            outline: 2px solid #f2c14e;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        button,
        input,
        select {
            font: inherit;
            border-radius: 7px;
            padding: 10px;
            border: 1px solid #485c74;
            background: #22364e;
            color: white;
        }

        button {
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            filter: brightness(1.2);
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .primary {
            background: #23805d;
            border-color: #45b58a;
        }

        .danger {
            background: #91383e;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 12px;
        }

        #log {
            height: 220px;
            overflow: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        #log div {
            padding: 5px 0;
            border-bottom: 1px solid #304057;
        }

        dialog {
            background: #172538;
            color: #edf4ff;
            border: 1px solid #60738a;
            border-radius: 14px;
            width: min(520px, 94vw);
            max-height: 90vh;
            overflow: auto;
        }

        dialog::backdrop {
            background: #000b;
        }

        label {
            display: block;
            margin: 12px 0 5px;
        }

        input,
        select {
            width: 100%;
        }

        .property {
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid #354459;
        }

        .help {
            font-size: 13px;
            line-height: 1.6;
        }

        #notice {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 950px) {
            main {
                grid-template-columns: 1fr;
                padding: 8px;
                gap: 10px;
            }

            .board {
                min-width: 0;
            }

            .space {
                font-size: 8px;
                padding: 2px;
            }

            .stripe {
                height: 5px;
            }

            .token {
                width: 13px;
                height: 13px;
                font-size: 8px;
            }

            .center {
                gap: 10px;
            }

            .dice {
                font-size: 32px;
            }

            aside {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .panel {
                margin: 0;
            }

            .wide {
                grid-column: 1 / -1;
            }

            header {
                padding: 12px;
            }
        }

        @media (max-width: 500px) {
            aside {
                display: block;
            }

            .panel {
                margin-bottom: 10px;
            }

            .center p {
                font-size: 12px;
            }

            .space .price {
                font-size: 7px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>Monopoly <small>Friends Edition</small></h1>
            <small id="connectionStatus">
                Connecting to the game server…
            </small>
        </div>

        <button onclick="showRules()">Rules</button>
    </header>

    <div id="notice">Connecting…</div>

    <main hidden>
        <section id="board" class="board"></section>

        <aside>
            <section class="panel">
                <div class="row">
                    <h3 style="margin:0">Players</h3>
                    <button onclick="newGame()">New game</button>
                </div>

                <div id="players" class="players"></div>
            </section>

            <section class="panel">
                <h3 id="turnTitle">Your turn</h3>
                <div id="status"></div>

                <div class="actions">
                    <button
                        class="primary"
                        id="roll"
                        onclick="roll()"
                    >
                        Roll dice
                    </button>

                    <button id="end" onclick="endTurn()">
                        End turn
                    </button>

                    <button id="bail" onclick="bail()">
                        Pay $50 bail
                    </button>

                    <button id="jailcard" onclick="useCard()">
                        Use jail card
                    </button>

                    <button id="trade" onclick="tradeDialog()">
                        Trade
                    </button>

                    <button
                        id="bankrupt"
                        class="danger"
                        onclick="bankrupt()"
                    >
                        Declare bankruptcy
                    </button>
                </div>
            </section>

            <section class="panel wide">
                <h3 id="portfolioTitle">Properties</h3>
                <div id="portfolio"></div>

                <p class="muted help">
                    The current player can click board spaces to inspect
                    properties and manage buildings or mortgages.
                </p>
            </section>

            <section class="panel wide">
                <h3>Game log</h3>
                <div id="log"></div>
            </section>
        </aside>
    </main>

    <dialog id="modal">
        <div id="modalBody"></div>
    </dialog>

<script>
const names = [
    'GO',
    'Mediterranean Avenue',
    'Community Chest',
    'Baltic Avenue',
    'Income Tax',
    'Reading Railroad',
    'Oriental Avenue',
    'Chance',
    'Vermont Avenue',
    'Connecticut Avenue',
    'Jail / Just Visiting',
   St. Charles Place',
    'Electric Company',
    'States Avenue',
    'Virginia Avenue',
    'Pennsylvania Railroad',
    'St. James Place',
    'Community Chest',
    'Tennessee Avenue',
    'New York Avenue',
    'Free Parking',
    'Kentucky Avenue',
    'Chance',
    'Indiana Avenue',
    'Illinois Avenue',
    'B&O Railroad',
    'Atlantic Avenue',
    'Ventnor Avenue',
    'Water Works',
    'Marvin Gardens',
    'Go To Jail',
    'Pacific Avenue',
    'North Carolina Avenue',
    'Community Chest',
    'Pennsylvania Avenue',
    'Short Line Railroad',
    'Chance',
    'Park Place',
    'Luxury Tax',
    'Boardwalk'
];

const groups = [
    { color: '#885438', ids: [1, 3] },
    { color: '#83c9e8', ids: [6, 8, 9] },
    { color: '#d64f9b', ids: [11, 13, 14] },
    { color: '#ec9232', ids: [16, 18, 19] },
    { color: '#db3c41', ids: [21, 23, 24] },
    { color: '#e6cb37', ids: [26, 27, 29] },
    { color: '#31935b', ids: [31, 32, 34] },
    { color: '#3153ae', ids: [37, 39] }
];

const prices = {
    1: 60, 3: 60, 5: 200,
    6: 100, 8: 100, 9: 120,
    11: 140, 12: 150, 13: 140, 14: 160,
    15: 200, 16: 180, 18: 180, 19: 200,
    21: 220, 23: 220, 24: 240, 25: 200,
    26: 260, 27: 260, 28: 150, 29: 280,
    31: 300, 32: 300, 34: 320, 35: 200,
    37: 350, 39: 400
};

const $ = id => document.getElementById(id);
const money = amount => '$' + amount;

let net = null;
let s = null;
let pending = null;
let myIndex = -1;
let actor = -1;
let revision = 0;
let reconnectTimer = null;
let fatalError = false;

let room = new URLSearchParams(location.search).get('room');

let myToken = localStorage.getItem('monopoly-online-token');

if (!myToken) {
    myToken = crypto.randomUUID();
    localStorage.setItem('monopoly-online-token', myToken);
}

let nickname = sessionStorage.getItem('monopoly-name');

if (!nickname) {
    nickname = prompt('Your player name?', 'Player') || 'Player';
    nickname = nickname.trim().slice(0, 24) || 'Player';

    sessionStorage.setItem('monopoly-name', nickname);
}

function esc(text) {
    return String(text).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[character]));
}

function send(type, data = {}) {
    if (net && net.readyState === WebSocket.OPEN) {
        net.send(JSON.stringify({
            type,
            ...data
        }));
    }
}

function modal(body) {
    $('modalBody').innerHTML = body;

    if (!$('modal').open) {
        $('modal').showModal();
    }
}

$('modal').addEventListener('cancel', event => {
    event.preventDefault();
});

function position(i) {
    if (i <= 10) return [11, 11 - i];
    if (i <= 20) return [21 - i, 1];
    if (i <= 30) return [1, i - 19];

    return [i - 29, 11];
}

function render() {
    if (!s) {
        return;
    }

    const current = s.players[s.turn];
    const allowed = myIndex === actor;
    const connected = net && net.readyState === WebSocket.OPEN;
    const canAct = allowed && connected;
    const gameOver = s.winner !== null;

    $('notice').hidden = true;
    document.querySelector('main').hidden = false;

    const board = $('board');
    board.innerHTML = '';

    names.forEach((name, i) => {
        const [row, column] = position(i);
        const set = groups.find(g => g.ids.includes(i));
        const ownerId = s.owners[i];
        const property = s.props[i];

        const element = document.createElement('div');

        element.className = 'space';
        element.style.gridRow = row;
        element.style.gridColumn = column;

        element.onclick = () => {
            if (myIndex === actor && !pending) {
                window.details(i);
            }
        };

        let buildings = '';

        if (property && property.houses) {
            buildings = property.houses === 5
                ? ' 🏨'
                : ' ' + '⌂'.repeat(property.houses);
        }

        element.innerHTML = `
            <div
                class="stripe"
                style="background:${set ? set.color : 'transparent'}"
            ></div>

            <div>${esc(name)}</div>

            <div class="price">
                ${prices[i] ? money(prices[i]) : ''}

                ${
                    ownerId != null
                        ? `<span style="color:${s.players[ownerId].color}">
                               ●
                           </span>`
                        : ''
                }

                ${property && property.mort ? ' Ⓜ' : ''}
                ${buildings}
            </div>

            <div class="tokens">
                ${
                    s.players.map((player, index) =>
                        !player.out && player.pos === i
                            ? `<span
                                   class="token"
                                   style="--c:${player.color}"
                                   title="${esc(player.name)}"
                               >${index + 1}</span>`
                            : ''
                    ).join('')
                }
            </div>
        `;

        board.append(element);
    });

    let centerMessage;

    if (gameOver) {
        centerMessage = 'Last player standing.';
    } else if (pending && pending.type === 'auction') {
        centerMessage = 'Auction in progress.';
    } else if (s.phase === 'debt') {
        centerMessage = 'Raise cash to settle your debt.';
    } else if (current.jail && s.phase === 'roll') {
        centerMessage = 'Choose $50 bail, a jail card, or try doubles.';
    } else if (s.phase === 'roll') {
        centerMessage = 'Roll the dice to move.';
    } else {
        centerMessage = 'Manage your properties, then end your turn.';
    }

    const center = document.createElement('div');
    center.className = 'center';

    center.innerHTML = `
        <div class="logo">MONOPOLY</div>

        <p>Buy. Build. Trade. Win.</p>

        <div class="dice">
            ${s.dice.map(die => '⚀⚁⚂⚃⚄⚅'[die - 1]).join('')}
        </div>

        <h2>
            ${
                esc(
                    gameOver
                        ? s.players[s.winner].name + ' wins!'
                        : current.name + '’s turn'
                )
            }
        </h2>

        <p>${centerMessage}</p>

        <small style="color:#365440">
            Live online game · server restart clears rooms.
        </small>
    `;

    board.append(center);

    $('players').innerHTML = s.players.map((player, index) => `
        <div
            class="player ${index === s.turn ? 'active' : ''}"
            style="--c:${player.color}"
        >
            <div class="row">
                <strong>
                    ${esc(player.name)}
                    ${index === myIndex ? ' (you)' : ''}
                </strong>

                <span>${money(player.cash)}</span>
            </div>

            <small>
                ${
                    player.out
                        ? 'Bankrupt'
                        : esc(names[player.pos]) +
                          (player.jail ? ' · In jail' : '')
                }

                · ${
                    Object.keys(prices).filter(
                        i => s.owners[i] === index
                    ).length
                } properties

                ${player.cards ? ' · ' + player.cards + ' jail card(s)' : ''}
            </small>
        </div>
    `).join('');

    $('turnTitle').textContent = gameOver
        ? 'Game over'
        : current.name + '’s turn';

    let status;

    if (s.phase === 'debt') {
        status =
            'Cash shortfall: ' + money(-current.cash) +
            '. Sell buildings, mortgage, or trade.';
    } else if (current.jail) {
        status = 'In jail · turn ' + (current.tries + 1) + ' of 3';
    } else {
        status = 'At ' + names[current.pos];
    }

    if (!gameOver) {
        status += allowed
            ? ' · Your action'
            : ' · Waiting for ' + (s.players[actor]?.name || 'another player');
    }

    $('status').textContent = status;

    $('roll').disabled =
        !canAct || gameOver || s.phase !== 'roll' || Boolean(pending);

    $('end').disabled =
        !canAct || gameOver || s.phase !== 'end' || Boolean(pending);

    $('bail').hidden =
        !current.jail || s.phase !== 'roll';

    $('bail').disabled =
        !canAct || gameOver || current.cash < 50 || Boolean(pending);

    $('jailcard').hidden =
        !current.jail || !current.cards || s.phase !== 'roll';

    $('jailcard').disabled =
        !canAct || gameOver || Boolean(pending);

    $('trade').disabled =
        !canAct || gameOver || Boolean(pending);

    $('bankrupt').disabled =
        !canAct || gameOver || s.phase !== 'debt';

    $('portfolioTitle').textContent = current.name + '’s properties';

    $('portfolio').innerHTML = Object.keys(prices)
        .filter(i => s.owners[i] === s.turn)
        .map(i => {
            const property = s.props[i];

            const buildingText = property.houses
                ? ' · ' + (
                    property.houses === 5
                        ? 'hotel'
                        : property.houses + ' houses'
                )
                : '';

            return `
                <div class="property">
                    <div class="row">
                        <span>
                            ${esc(names[i])}
                            ${property.mort ? ' · mortgaged' : ''}
                            ${buildingText}
                        </span>

                        <button
                            onclick="details(${i})"
                            ${!canAct || pending ? 'disabled' : ''}
                        >
                            Manage
                        </button>
                    </div>
                </div>
            `;
        })
        .join('') || '<small>No properties yet.</small>';

    $('log').innerHTML = s.log
        .map(text => '<div>' + esc(text) + '</div>')
        .join('');

    $('connectionStatus').textContent =
        'Online room ' + room +
        ' · You: ' + s.players[myIndex].name;
}

const remoteNames = [
    'roll',
    'endTurn',
    'bail',
    'useCard',
    'buy',
    'auctionStart',
    'auctionBid',
    'auctionPass',
    'details',
    'build',
    'sellBuilding',
    'mortgage',
    'tradeDialog',
    'tradeFields',
    'propose',
    'acceptTrade',
    'closeModal',
    'bankrupt'
];

for (const name of remoteNames) {
    window[name] = (...args) => {
        if (myIndex !== actor) {
            return;
        }

        if (!net || net.readyState !== WebSocket.OPEN) {
            return alert('The game is disconnected. Please wait.');
        }

        if (
            name === 'bankrupt' &&
            !confirm('Declare bankruptcy and leave this game?')
        ) {
            return;
        }

        const inputs = {};

        document.querySelectorAll(
            '#modal input, #modal select'
        ).forEach(element => {
            if (!element.id) {
                return;
            }

            inputs[element.id] = {
                value: element.value,
                selected: Array.from(
                    element.selectedOptions || [],
                    option => option.value
                )
            };
        });

        send('action', {
            name,
            args,
            inputs,
            revision
        });
    };
}

function newGame() {
    alert(
        'Open the website address without ?room=... ' +
        'in a new tab to create another room.'
    );
}

function showRules() {
    alert(
        'MONOPOLY — FRIENDS EDITION\n\n' +

        'Buy properties, collect rent, and build evenly on full color sets. ' +
        'The last player who is not bankrupt wins.\n\n' +

        'AUCTIONS: The player who declines a property and starts the ' +
        'auction cannot bid. Only the other eligible players may bid. ' +
        'A sole remaining bidder must still place a bid or withdraw.\n\n' +

        'JAIL: At the start of a jailed turn, choose to pay $50 before ' +
        'rolling, use a jail card, or try doubles. You may pay early on ' +
        'your first two jail turns. Payment before rolling is also allowed ' +
        'on turn three. After a third failed doubles attempt, pay $50 ' +
        'and move using that roll. Jail-release doubles do not grant ' +
        'an extra roll.\n\n' +

        'Manage properties to sell buildings, mortgage, or unmortgage. ' +
        'Buildings must be bought and sold evenly. Sell all buildings ' +
        'in a color set before mortgaging or trading its properties.\n\n' +

        'House rules: income tax is 10% of cash capped at $200; ' +
        'luxury tax is $75; Free Parking pays nothing. ' +
        'Building supplies and card decks are simplified.\n\n' +

        'Rooms are stored in server memory. Restarting the server ' +
        'clears active games.'
    );
}

function copyRoomLink() {
    const input = $('roomLink');

    if (navigator.clipboard) {
        navigator.clipboard.writeText(location.href).catch(() => {
            input.focus();
            input.select();
            alert('Copy the selected room link.');
        });
    } else {
        input.focus();
        input.select();
        alert('Copy the selected room link.');
    }
}

function lobby(data) {
    myIndex = data.me;

    document.querySelector('main').hidden = true;
    $('notice').hidden = true;

    $('connectionStatus').textContent =
        'Room ' + room + ' · Waiting for players';

    modal(`
        <h2>Room ${esc(room)}</h2>

        <p>Send this link to your friends:</p>

        <input
            id="roomLink"
            readonly
            value="${esc(location.href)}"
        >

        <div class="actions">
            <button onclick="copyRoomLink()">Copy link</button>
        </div>

        <p>
            ${
                data.players.map((player, index) =>
                    esc(player.name) +
                    (index === 0 ? ' (host)' : '') +
                    (index === myIndex ? ' (you)' : '') +
                    (player.online ? '' : ' (disconnected)')
                ).join('<br>')
            }
        </p>

        ${
            myIndex === 0
                ? `<button
                       class="primary"
                       onclick="send('start')"
                       ${data.players.length < 2 ? 'disabled' : ''}
                   >
                       Start game
                   </button>`
                : '<p>Waiting for the host to start…</p>'
        }

        ${
            data.players.length < 2
                ? `<p class="help">
                       At least two players are required.
                       To test by yourself, join the room using a
                       private/incognito window or a different browser.
                   </p>`
                : ''
        }
    `);
}

function handleState(data) {
    myIndex = data.me;
    actor = data.actor;
    revision = data.revision;

    s = data.s;
    pending = data.pending;

    render();

    $('modalBody').innerHTML = data.modal || '';

    if (data.modal) {
        if (!$('modal').open) {
            $('modal').showModal();
        }
    } else {
        $('modal').close();
    }

    if (myIndex !== actor) {
        document.querySelectorAll(
            '#modal button, #modal input:not([readonly]), #modal select'
        ).forEach(element => {
            element.disabled = true;
        });
    }
}

function connect() {
    if (fatalError) {
        return;
    }

    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';

    net = new WebSocket(protocol + '://' + location.host + '/ws');

    net.onopen = () => {
        $('connectionStatus').textContent = 'Connected';

        send('join', {
            room,
            token: myToken,
            name: nickname
        });
    };

    net.onmessage = event => {
        let data;

        try {
            data = JSON.parse(event.data);
        } catch (error) {
            return;
        }

        if (data.type === 'joined') {
            room = data.room;
            myIndex = data.me;

            history.replaceState(
                null,
                '',
                '?room=' + encodeURIComponent(room)
            );
        }

        if (data.type === 'lobby') {
            lobby(data);
        }

        if (data.type === 'state') {
            handleState(data);
        }

        if (data.type === 'error') {
            alert(data.message);

            if (
                data.message.includes('Room not found') ||
                data.message.includes('has started or is full') ||
                data.message.includes('Invalid session')
            ) {
                fatalError = true;

                $('connectionStatus').textContent = 'Unable to join room';

                if (net) {
                    net.close();
                }
            }
        }
    };

    net.onclose = () => {
        if (fatalError) {
            return;
        }

        $('connectionStatus').textContent =
            'Disconnected — reconnecting…';

        document.querySelectorAll(
            'main button, #modal button, #modal select'
        ).forEach(element => {
            element.disabled = true;
        });

        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 2000);
    };

    net.onerror = () => {
        $('connectionStatus').textContent =
            'Connection problem — check that the server is running.';
    };
}

connect();
</script>
</body>
</html>
